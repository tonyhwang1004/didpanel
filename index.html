<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김엄마 관리형독서실 송도점 · 입구 안내</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#16233F;cursor:none;}
  body{display:flex;justify-content:center;align-items:center;}
  .show{width:100%;height:100%;position:relative;display:flex;justify-content:center;align-items:center;}
  .slide{display:none;width:100%;height:100%;position:absolute;top:0;left:0;
         opacity:0;transition:opacity 1s ease;}
  .slide.active{display:flex;opacity:1;justify-content:center;align-items:center;}
  .slide.fade-out{display:flex;opacity:0;}
  .slide img{max-width:100%;max-height:100%;object-fit:contain;}
  .pb{position:absolute;bottom:0;left:0;height:6px;
      background:linear-gradient(90deg,#2FB39A,#4FD6B8);width:0%;z-index:100;}

  /* ===== D-day 표지 =====
     화면 높이(vh) 기준으로만 계산합니다. 구형 브라우저에서도 동작합니다.
     세로패널 1080x1920 기준 : 카드 폭 = 화면 높이 x 0.5625            */
  .dcard{
    width:56.25vh; height:100vh; background:#16233F; position:relative;
    padding:6.2vh 5.4vh;
    font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR','Nanum Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .dcard .brand{font-size:1.86vh;font-weight:800;color:#4FD6B8;letter-spacing:-0.05vh;margin-bottom:1.7vh;}
  .dcard .dday {font-size:17.4vh;font-weight:900;color:#fff;letter-spacing:-0.9vh;line-height:0.95;}
  .dcard .exam {font-size:1.91vh;color:#94A6C6;letter-spacing:-0.06vh;margin-top:1.35vh;}
  .dcard .head {font-size:4.84vh;font-weight:900;color:#fff;letter-spacing:-0.21vh;line-height:1.3;margin-top:4.5vh;}
  .dcard .head em{font-style:normal;color:#4FD6B8;}
  .dcard .box  {margin-top:3.9vh;border-left:0.68vh solid #2FB39A;padding:1.7vh 0 1.7vh 2vh;}
  .dcard .box .b1{font-size:2.31vh;font-weight:800;color:#fff;letter-spacing:-0.1vh;margin-bottom:0.9vh;}
  .dcard .box .b2{font-size:1.8vh;color:#94A6C6;letter-spacing:-0.06vh;}
  .dcard .list {margin-top:3.9vh;font-size:1.86vh;color:#B7C4D6;letter-spacing:-0.06vh;line-height:2;}
  .dcard .foot {position:absolute;left:5.4vh;bottom:5vh;font-size:1.7vh;color:#94A6C6;letter-spacing:-0.05vh;}
  .dcard .foot b{color:#fff;}
</style>
</head>
<body>
<div class="show">

  <!-- 1. D-day 표지 : 하루가 지나면 숫자가 자동으로 줄어듭니다 -->
  <div class="slide active">
    <div class="dcard">
      <div class="brand">김엄마 관리형독서실 송도점</div>
      <div class="dday" id="ddayNum">&nbsp;</div>
      <div class="exam">2026. 11. 19 (목) 대학수학능력시험</div>
      <div class="head">김엄마는<br><em>시간표입니다</em></div>
      <div class="box">
        <div class="b1">의지가 아니라 시간표가 <span id="ddayDays">남은 날</span>을 지킵니다</div>
        <div class="b2">하루 최대 8교시, 08:00 – 01:00 의무학습</div>
      </div>
      <div class="list">
        김엄마는 차단이 아니라 기준입니다<br>
        김엄마는 플래너입니다<br>
        김엄마는 잔소리이자 용돈입니다<br>
        김엄마는 기록입니다
      </div>
      <div class="foot"><b>2학기 집중관리반 모집</b> &nbsp;|&nbsp; 상담문의 010-4602-1953</div>
    </div>
  </div>

  <!-- 2~5. 안내 카드 -->
  <div class="slide"><img src="panel_2.png" alt="전자기기 방화벽"></div>
  <div class="slide"><img src="panel_3.png" alt="스터디 플래너"></div>
  <div class="slide"><img src="panel_4.png" alt="상벌점 캐시백"></div>
  <div class="slide"><img src="panel_5.png" alt="학부모 안내"></div>

  <div class="pb" id="pb"></div>
</div>

<script>
/* ================================================================
   수능 D-day 자동 계산
   아래 날짜만 맞으면 매일 알아서 하루씩 줄어듭니다.
   (수능 날짜가 바뀌면 이 줄만 고치세요. 월은 0부터입니다 → 10 = 11월)
   ================================================================ */
var EXAM_Y = 2026, EXAM_M = 10, EXAM_D = 19;   // 2026년 11월 19일

var lastShown = null;

function updateDday(){
  var now   = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var exam  = new Date(EXAM_Y, EXAM_M, EXAM_D);
  var left  = Math.round((exam - today) / 86400000);

  if (left === lastShown) return;   // 값이 바뀔 때만 다시 그림
  lastShown = left;

  var n = document.getElementById('ddayNum');
  var d = document.getElementById('ddayDays');

  if (left > 0){
    n.innerHTML = 'D-' + left;
    d.innerHTML = '남은 ' + left + '일';
  } else if (left === 0){
    n.innerHTML = 'D-DAY';
    d.innerHTML = '오늘';
  } else {
    n.innerHTML = 'D+' + Math.abs(left);
    d.innerHTML = '지나온 ' + Math.abs(left) + '일';
  }
}

updateDday();
setInterval(updateDday, 30000);          // 30초마다 확인 (자정 넘김 대응)
window.addEventListener('focus', updateDday);
document.addEventListener('visibilitychange', updateDday);

/* ===== 슬라이드쇼 ===== */
var S  = document.querySelectorAll('.slide'),
    pb = document.getElementById('pb'),
    T  = S.length,
    DUR = 7000;                          // 슬라이드당 7초
var c = 0, tm = null;

function show(n){
  var p = c;
  c = ((n % T) + T) % T;
  S[p].className = 'slide fade-out';
  setTimeout(function(){ S[p].className = 'slide'; }, 100);
  S[c].className = 'slide active';
  prog();
}
function prog(){
  pb.style.transition = 'none';
  pb.style.width = '0%';
  setTimeout(function(){
    pb.style.transition = 'width ' + DUR + 'ms linear';
    pb.style.width = '100%';
  }, 30);
  clearTimeout(tm);
  tm = setTimeout(function(){ show(c + 1); }, DUR);
}
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); clearTimeout(tm); show(c + 1); }
  if (e.key === 'ArrowLeft'){ clearTimeout(tm); show(c - 1); }
});
prog();
</script>
</body>
</html>
